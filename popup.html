<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; width: 260px; padding: 10px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 6px; }
    button { width: 100%; padding: 6px; cursor: pointer; }
    #code { font-size: 22px; text-align: center; letter-spacing: 4px; margin-top: 8px; }
    #timer { text-align: center; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <label>Neptun TOTP secret (base32):</label>
  <input type="text" id="secret" placeholder="e.g. JBSWY3DPEHPK3PXP">
  <button id="save">Save secret</button>
  <div id="code"></div>
  <div id="timer"></div>
  <script src="totp.js"></script>
  <script src="popup.js"></script>
</body>
</html>
